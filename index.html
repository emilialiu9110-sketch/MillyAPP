    // --- 音效引擎 ---
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.linearRampToValueAtTime(170, now + 0.25);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'gacha') {
          osc.type = 'sine';
          [523, 587, 659, 783, 1046].forEach((freq, idx) => {
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          });
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(680, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    };

    // --- 智慧解析單行輸入，將「純單字」「詞性」「純中文解釋」徹底分離 ---
    const parseRawInputLine = (rawLine) => {
      let line = rawLine.replace(/^[-*•\d.)\s]+/, '').trim();
      if (!line) return null;

      const wordMatch = line.match(/^([a-zA-Z-]+)\s*(.*)$/);
      if (!wordMatch) return null;

      const cleanWord = wordMatch[1].trim().toLowerCase();
      let rest = wordMatch[2].trim();

      let extractedPos = '';
      const posRegex = /^[\[(]?(n\vert{}v\vert{}vt\vert{}vi\vert{}adj\vert{}adv\vert{}prep\vert{}conj\vert{}pron\vert{}int\vert{}phr\vert{}aux)\.?(?:\/(?:n\vert{}v\vert{}vt\vert{}vi\vert{}adj\vert{}adv\vert{}prep\vert{}conj\vert{}pron)\.?)?[\])]?\s*/i;
      const posMatch = rest.match(posRegex);
      if (posMatch) {
        extractedPos = posMatch[0].replace(/[\[\]()]/g, '').trim();
        if (!extractedPos.endsWith('.')) extractedPos += '.';
        rest = rest.slice(posMatch[0].length).trim();
      }

      const cleanZh = rest.replace(/[:：]/g, '；').trim() || '（待補充中文）';

      return {
        word: cleanWord,
        pos: extractedPos,
        zh: cleanZh
      };
    };

    // --- 推算原形以便從官方字典抓真實例句 ---
    const getBaseWordCandidates = (word) => {
      const candidates = [word];
      if (word.endsWith('ied') && word.length > 4) candidates.push(word.slice(0, -3) + 'y');
      if (word.endsWith('ed') && word.length > 3) {
        candidates.push(word.slice(0, -2));
        candidates.push(word.slice(0, -1));
        if (word.length > 4 && word[word.length - 3] === word[word.length - 4]) {
          candidates.push(word.slice(0, -3));
        }
      }
      if (word.endsWith('ing') && word.length > 4) {
        candidates.push(word.slice(0, -3));
        candidates.push(word.slice(0, -3) + 'e');
      }
      if (word.endsWith('ies') && word.length > 4) candidates.push(word.slice(0, -3) + 'y');
      if (word.endsWith('s') && !word.endsWith('ss') && word.length > 3) candidates.push(word.slice(0, -1));
      return [...new Set(candidates)];
    };

    function App() {

`- minority 少數
- property 屬性:財產

- strength 力量

      const idleCookiesPerMin = useMemo(() => {
        let base = 5;
        Object.keys(profile.ownedItems).forEach(id => {

      // --- 產生題目邏輯 ---
      const generateQuestion = (overrideMode = null) => {
        if (!words || words.length === 0) return;
        const targetWord = words[Math.floor(Math.random() * words.length)];
        const effectiveMode = overrideMode || quizMode;

        let qType = effectiveMode;
        if (effectiveMode === 'mixed') {
          const pool = ['en_to_zh', 'zh_to_en', 'cloze'];
          qType = pool[Math.floor(Math.random() * pool.length)];
        } else if (effectiveMode === 'mixed_choice') {
          qType = Math.random() < 0.5 ? 'en_to_zh' : 'zh_to_en';
        }

        const distractors = [...words]
          .filter(w => w.id !== targetWord.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        const fallbackDistractors = [
          { id: 'f1', word: 'abandon', zh: '放棄；遺棄' },
          { id: 'f2', word: 'benefit', zh: '利益；好處' },
          { id: 'f3', word: 'crucial', zh: '關鍵的；極重要的' }
        ];
        while (distractors.length < 3) {
          distractors.push(fallbackDistractors[distractors.length]);
        }

        const rawOptions = [targetWord, ...distractors].sort(() => Math.random() - 0.5);

        let options = [];
        if (qType === 'en_to_zh') {
          options = rawOptions.map(o => ({
            id: o.id,
            label: o.zh,
            isCorrect: o.id === targetWord.id
          }));
        } else {
          options = rawOptions.map(o => ({
            id: o.id,
            label: o.word,
            isCorrect: o.id === targetWord.id
          }));
        }

        const candidates = getBaseWordCandidates(targetWord.word);
        let clozeSentence = targetWord.example;
        let replaced = false;
        for (const cand of candidates) {
          const regex = new RegExp(`\\b${cand}[a-z]*\\b`, 'i');
          if (regex.test(clozeSentence)) {
            clozeSentence = clozeSentence.replace(regex, '________');
            replaced = true;
            break;
          }
        }
        if (!replaced) {
          clozeSentence = `${targetWord.example} (Fill in: ________)`;
        }

        setCurrentQ({
